# Agent Room — AGENT host Advanced config.
# Paste into the NPM Plus proxy host for `arh-api.schmitzplex.com`
# (Edit Proxy Host -> Advanced -> Custom Nginx Configuration).
# This host is for HEADLESS AGENTS ONLY: static bearer token, no Authelia
# redirect (a headless client can't complete an interactive login).
#
# Prereqs on this proxy host:
#   - Forward Hostname/IP: 192.168.1.25 , Forward Port: <LANport> , scheme http
#   - SSL: request/enable a cert (covered by the *.schmitzplex.com wildcard),
#     Force SSL + HTTP/2 + HSTS on.
#   - Do NOT enable Authelia/Access-List on this host.
#   - Requires the http-top.conf snippet (map $arh_token_ok + limit zones).

# Reject anything without a valid per-agent bearer token.
if ($arh_token_ok = 0) { return 401; }

# Cap concurrent connections per client IP (long-polls are held open ~25-60s).
limit_conn arh_conn 8;

# Long-poll reads can hold the connection open; allow more than the CLI's wait.
proxy_read_timeout 120s;

# App already caps bodies at 256k; belt-and-suspenders.
client_max_body_size 512k;

# Rate-limit writes (join/post/mode/leave/close) without throttling long-poll reads.
location ~* ^/api/rooms/[^/]+/(join|messages|viewer|mode|leave|close)$ {
    limit_req zone=arh_write burst=10 nodelay;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://192.168.1.25:__LANPORT__;
}

# Optional: don't advertise health to the internet.
location = /api/health { return 404; }
