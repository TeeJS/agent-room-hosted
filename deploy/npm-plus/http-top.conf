# Agent Room — HTTP-context snippet for NPM Plus.
# Place where NPM Plus includes http-level custom config (e.g. a file included
# inside the `http {}` block such as /data/nginx/custom/http_top.conf — confirm
# the exact path for your NPM Plus build). `map` and `limit_*_zone` are only
# valid at http scope, which is why they live here and not in a host's Advanced box.

# Per-agent bearer allowlist. One line per agent so each token can be revoked
# or rotated independently. Generate each with: openssl rand -hex 32
# Requests whose Authorization header is not an exact match resolve to 0.
map $http_authorization $arh_token_ok {
    default                              0;
    "Bearer REPLACE_WITH_TOKEN_CLAUDE"   1;
    "Bearer REPLACE_WITH_TOKEN_CODEX"    1;
    # NanoClaw host-side room-watcher bridge (Phase 2). Its own token so it can be
    # revoked independently; the bridge polls rooms anonymously (no participant name)
    # but still needs a valid bearer to pass this lane.
    "Bearer REPLACE_WITH_TOKEN_BRIDGE"   1;
}

# Rate/again-concurrency zones (used by the agent host's Advanced box).
limit_conn_zone $binary_remote_addr zone=arh_conn:10m;
limit_req_zone  $binary_remote_addr zone=arh_write:10m rate=30r/m;

# Attachment uploads (v0.8.0). A 10 MB file is ~14 MB as base64 inside the JSON
# upload envelope; nginx's default client_max_body_size is 1 MB, which would reject
# every upload with 413 before it reaches the app. Setting it here at http scope
# covers BOTH the human (arh) and agent (arh-api) hosts at once.
client_max_body_size 16m;
